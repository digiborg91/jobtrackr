name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Adds a "Run workflow" button on the Actions tab, for kicking off the
  # suite on demand — e.g. after a manual Netlify redeploy that wasn't
  # triggered by a git push, so wouldn't otherwise run CI.
  workflow_dispatch: {}

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    # These tests run against the live production site rather than a local
    # dev server, so no Postgres service or `netlify dev` is needed here —
    # just credentials for the shared test account, stored as repo secrets.
    env:
      EMAIL: ${{ secrets.E2E_EMAIL }}
      PASSWORD: ${{ secrets.E2E_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b --noEmit

      - name: Lint
        run: npm run lint

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run API tests
        run: npm run e2e:api

      - name: Run UI tests
        run: npm run e2e:browser

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
